<template id="scene-template">
  <div
    data-composition-id="scene"
    data-width="1920"
    data-height="1080"
    data-duration="10"
  >
    <style>
      @font-face { font-family: "Noto Sans CJK SC"; src: local("Noto Sans CJK SC"); }
      @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"); }
      [data-composition-id="scene"] {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(900px 600px at 15% 10%, rgba(34, 211, 238, 0.18), transparent 65%),
          radial-gradient(800px 600px at 88% 85%, rgba(255, 107, 157, 0.16), transparent 65%),
          #0b1020;
        font-family: "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(139, 148, 158, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 148, 158, 0.08) 1px, transparent 1px);
        background-size: 80px 80px;
      }
      .kick {
        position: absolute; left: 140px; top: 118px;
        color: #22d3ee; font-size: 26px; letter-spacing: 0.22em; font-weight: 700;
      }
      h1 {
        position: absolute; left: 136px; top: 188px;
        color: #e6edf3; font-size: 112px; line-height: 1.05; font-weight: 800;
        letter-spacing: -0.03em;
      }
      h1 .accent {
        background: linear-gradient(90deg, #22d3ee, #ff6b9d);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .sub {
        position: absolute; left: 142px; top: 458px;
        color: #8b949e; font-size: 38px;
      }
      .card {
        position: absolute; top: 618px; width: 480px; height: 232px;
        border-radius: 28px; border: 2px solid #2d3650;
        background: rgba(21, 27, 46, 0.92); padding: 34px 38px;
      }
      #card1 { left: 140px; }
      #card2 { left: 648px; }
      #card3 { left: 1156px; }
      .card b {
        display: block; color: #22d3ee; font-size: 22px;
        font-weight: 700; letter-spacing: 0.16em;
      }
      .card span {
        display: block; color: #e6edf3; font-size: 40px;
        font-weight: 700; margin-top: 18px;
      }
      .card small {
        display: block; color: #8b949e; font-size: 24px;
        line-height: 1.45; margin-top: 12px;
      }
      .bar-wrap {
        position: absolute; left: 140px; bottom: 80px; width: 1640px; height: 10px;
        border-radius: 999px; background: #1b2440; overflow: hidden;
      }
      #bar {
        width: 100%; height: 100%;
        background: linear-gradient(90deg, #22d3ee, #ff6b9d);
        transform-origin: left center;
      }
      .tag {
        position: absolute; right: 140px; bottom: 120px;
        color: #ffd166; font-size: 26px; font-weight: 700; letter-spacing: 0.08em;
      }
    </style>

    <div class="grid"></div>
    <div class="kick" id="kick">HYPERFRAMES · HTML TO VIDEO</div>
    <h1 id="title">写得像网页，<br /><span class="accent">渲染成视频。</span></h1>
    <div class="sub" id="sub">HTML + CSS + GSAP；逐帧可寻址，输出确定性 MP4。</div>

    <article class="card" id="card1">
      <b>01 · AUTHOR</b>
      <span>纯 HTML</span>
      <small>不是 React 组件，也不是 Python 场景。</small>
    </article>
    <article class="card" id="card2">
      <b>02 · ANIMATE</b>
      <span>GSAP 时间线</span>
      <small>暂停、可 seek，每一帧都确定。</small>
    </article>
    <article class="card" id="card3">
      <b>03 · RENDER</b>
      <span>一条命令</span>
      <small>无头 Chrome 逐帧截图，FFmpeg 编码。</small>
    </article>

    <div class="bar-wrap"><div id="bar"></div></div>
    <div class="tag" id="tag">npx hyperframes render</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kick", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.6 }, 0.15);
      tl.fromTo("#title", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.3);
      tl.fromTo("#sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7 }, 0.8);
      tl.fromTo(".card", { opacity: 0, y: 54, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.65, stagger: 0.14, ease: "power2.out" }, 1.2);
      tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.9);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 9.2, ease: "none" }, 0.2);
      tl.to("#kick, #title, #sub, .card, #tag, .bar-wrap", { opacity: 0, duration: 0.5 }, 9.45);
      window.__timelines = window.__timelines || {};
      window.__timelines["scene"] = tl;
      tl.seek(0);
    </script>
  </div>
</template>
