name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Validate examples
        run: python scripts/validate_examples.py
      - name: Preflight example models
        run: python scripts/preflight_model.py examples/transformer/project.json --registry assets/model-registry.example.json
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: QA example video
        run: |
          python scripts/qa_video.py examples/transformer/render/final.mp4 \
            --project transformer-example \
            --storyboard examples/transformer/storyboard.json \
            --captions examples/transformer/captions.srt \
            --require-audio --out /tmp/qa.json
      - name: Release scan (warnings allowed)
        run: python scripts/check_release.py
      - name: Compile scripts
        run: python -m compileall -q scripts
